<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vault door background -->
  <rect x="30" y="40" width="140" height="160" rx="8" fill="url(#vaultGradient)" stroke="#fff" stroke-width="2" opacity="0.95"/>
  
  <!-- Vault door detail lines -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="80" x2="150" y2="80" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="#fff" stroke-width="2" opacity="0.3"/>
  
  <!-- Lock mechanism (center circle) -->
  <circle cx="100" cy="140" r="35" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="100" cy="140" r="25" fill="#fff" opacity="0.2"/>
  
  <!-- Lock handle -->
  <line x1="100" y1="175" x2="100" y2="190" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="85" y="175" width="30" height="8" rx="4" fill="#fff"/>
  
  <!-- Small decorative circles -->
  <circle cx="70" cy="120" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="130" cy="120" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="70" cy="160" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="130" cy="160" r="4" fill="#fff" opacity="0.6"/>
</svg>
